services:
  ellcakes_front:
    container_name: ellcakes-front
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        - SERVER_URL=https://api.ellcakes.ru/api/graphql
        - Y_MAP_API=0ccc36c9-da58-40ad-a6b2-d93f797eea3a
    environment: 
      - NEXT_PUBLIC_SERVER_URL=https://api.ellcakes.ru/api/graphql
      - SERVER_URL=https://api.ellcakes.ru/api/graphql
    restart: always
    ports:
        - 3000:3000